<header class="navigation">
  <div class="navigation__breadcrumb">
    <svg class="navigation__home-icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
      <path d="M9 21V12h6v9"/>
    </svg>
    <span class="navigation__separator">/</span>
    <span class="navigation__page-name">
      <ng-content></ng-content>
    </span>
  </div>

  <div class="navigation__user" (click)="toggleDropdown(); $event.stopPropagation()">
    <svg class="navigation__user-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 12c2.7 0 4-1.3 4-4s-1.3-4-4-4-4 1.3-4 4 1.3 4 4 4zm0 2c-4.4 0-8 2.7-8 6h16c0-3.3-3.6-6-8-6z"/>
    </svg>
    <span class="navigation__user-name">{{ fullName }}</span>
    <svg class="navigation__chevron" [class.open]="isDropdownOpen" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <polyline points="6 9 12 15 18 9"/>
    </svg>

    @if (isDropdownOpen) {
      <div class="navigation__dropdown">
        <button class="navigation__dropdown-item" (click)="onLogout(); $event.stopPropagation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    }
  </div>
</header>
