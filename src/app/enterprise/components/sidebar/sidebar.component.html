<aside class="sidebar">

  <div class="sidebar__header">
    <div class="logo-and-text" [style.--logo-width]="logoWidth">
      <img
        class="logo-and-text__img"
        [src]="logoConfig.src"
        [alt]="logoConfig.label"
        (error)="$any($event.target).style.display='none'; $any($event.target).nextElementSibling.style.display='flex'"
      />
      <div class="logo-and-text__fallback" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                   15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <span
        class="logo-and-text__label"
        [style.font-weight]="logoConfig.fontWeight"
      >
        {{ logoConfig.label }}
      </span>
    </div>
  </div>

  <nav class="sidebar__nav" aria-label="Main navigation">
    @for (group of visibleGroups(); track group.id) {
      <div class="nav-group">

        <button
          class="nav-group__trigger"
          [attr.aria-expanded]="openGroups[group.id]"
          (click)="toggleGroup(group.id)"
        >

          <svg class="nav-group__folder-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0
                     2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/>
          </svg>

          <span>{{ group.label }}</span>

          <svg class="nav-group__chevron" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <ul class="nav-group__children" role="list">
          <div>
            @for (item of group.children; track item.route) {
              <li>
                <a
                  class="nav-item"
                  [routerLink]="item.route"
                  routerLinkActive="nav-item--active"
                >
                  <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="1.8"
                       stroke-linecap="round" stroke-linejoin="round">
                    <path [attr.d]="item.icon"/>
                  </svg>
                  {{ item.label }}
                </a>
              </li>
            }
          </div>
        </ul>

      </div>
    }

  </nav>
</aside>
